<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Background -->
  <rect width="500" height="500" fill="#0A0F1E"/>

  <!-- Stone Pillar Icon -->
  <!-- Capital (top plate) -->
  <rect x="175" y="100" width="150" height="14" fill="#C9973A"/>
  <!-- Abacus detail -->
  <rect x="185" y="114" width="130" height="6" fill="#F5F0E8" opacity="0.6"/>
  <!-- Column shaft -->
  <rect x="210" y="120" width="80" height="160" fill="#F5F0E8"/>
  <!-- Subtle fluting lines on shaft -->
  <line x1="228" y1="120" x2="228" y2="280" stroke="#0A0F1E" stroke-width="1.5" opacity="0.3"/>
  <line x1="246" y1="120" x2="246" y2="280" stroke="#0A0F1E" stroke-width="1.5" opacity="0.3"/>
  <line x1="264" y1="120" x2="264" y2="280" stroke="#0A0F1E" stroke-width="1.5" opacity="0.3"/>
  <line x1="282" y1="120" x2="282" y2="280" stroke="#0A0F1E" stroke-width="1.5" opacity="0.3"/>
  <!-- Base -->
  <rect x="195" y="280" width="110" height="10" fill="#F5F0E8" opacity="0.6"/>
  <rect x="180" y="290" width="140" height="14" fill="#C9973A"/>

  <!-- Divider line -->
  <line x1="130" y1="335" x2="370" y2="335" stroke="#C9973A" stroke-width="1" opacity="0.5"/>

  <!-- Wordmark: HYACINTH -->
  <text
    x="250"
    y="400"
    text-anchor="middle"
    font-family="'Arial Narrow', 'Impact', 'Haettenschweiler', sans-serif"
    font-weight="900"
    font-size="64"
    letter-spacing="12"
    fill="#F5F0E8"
    font-stretch="condensed"
  >HYACINTH</text>

  <!-- Subtitle -->
  <text
    x="250"
    y="435"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-weight="400"
    font-size="11"
    letter-spacing="6"
    fill="#C9973A"
    opacity="0.85"
  >ATHLETICS</text>
</svg>
