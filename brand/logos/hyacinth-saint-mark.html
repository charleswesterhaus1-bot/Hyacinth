<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HYACINTH — Saint Mark</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

</head>
<body>
<h1>HYACINTH</h1>
<p class="sub">SAINT MARK — BRAND IDENTITY</p>

      <text x="180" y="515" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="8" letter-spacing="5.5"
        fill="#C9973A" opacity="0.85">CARRY WHAT OTHERS CANNOT</text>
    </svg>
    <p class="card-label">SAINT MARK — PRIMARY</p>
  </div>
