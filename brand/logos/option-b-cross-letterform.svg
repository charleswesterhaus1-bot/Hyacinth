<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <!-- Background -->
  <rect width="600" height="300" fill="#0A0F1E"/>

  <!-- Wordmark with custom H -->
  <!-- We'll render each letter manually to customize the H -->

  <!-- H - with cross integrated -->
  <!-- Left vertical of H -->
  <rect x="50" y="80" width="18" height="140" fill="#F5F0E8"/>
  <!-- Right vertical of H -->
  <rect x="110" y="80" width="18" height="140" fill="#F5F0E8"/>
  <!-- Crossbar of H (horizontal) — this IS the cross -->
  <rect x="50" y="142" width="78" height="16" fill="#C9973A"/>
  <!-- Vertical cross extension (top) -->
  <rect x="80" y="80" width="18" height="62" fill="#C9973A"/>
  <!-- Vertical cross extension (bottom) -->
  <rect x="80" y="158" width="18" height="62" fill="#C9973A"/>

  <!-- Y -->
  <text x="145" y="220" font-family="'Arial Narrow','Impact',sans-serif" font-weight="900" font-size="140" fill="#F5F0E8" letter-spacing="0">Y</text>
  <!-- A -->
  <text x="205" y="220" font-family="'Arial Narrow','Impact',sans-serif" font-weight="900" font-size="140" fill="#F5F0E8" letter-spacing="0">A</text>
  <!-- C -->
  <text x="267" y="220" font-family="'Arial Narrow','Impact',sans-serif" font-weight="900" font-size="140" fill="#F5F0E8" letter-spacing="0">C</text>
  <!-- I -->
  <text x="323" y="220" font-family="'Arial Narrow','Impact',sans-serif" font-weight="900" font-size="140" fill="#F5F0E8" letter-spacing="0">I</text>
  <!-- N -->
  <text x="345" y="220" font-family="'Arial Narrow','Impact',sans-serif" font-weight="900" font-size="140" fill="#F5F0E8" letter-spacing="0">N</text>
  <!-- T -->
  <text x="412" y="220" font-family="'Arial Narrow','Impact',sans-serif" font-weight="900" font-size="140" fill="#F5F0E8" letter-spacing="0">T</text>
  <!-- H final -->
  <text x="464" y="220" font-family="'Arial Narrow','Impact',sans-serif" font-weight="900" font-size="140" fill="#F5F0E8" letter-spacing="0">H</text>

  <!-- Thin gold baseline -->
  <line x1="50" y1="235" x2="550" y2="235" stroke="#C9973A" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="300" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="5" fill="#C9973A" opacity="0.8">CARRY WHAT OTHERS CANNOT</text>
</svg>
